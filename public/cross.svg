<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="crossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#crossGlow)" opacity="0.3" />
  <!-- Radiant halo ring -->
  <circle cx="50" cy="38" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7" />
  <!-- Vertical Beam -->
  <rect x="44" y="14" width="12" height="72" rx="3" fill="url(#goldGrad)" />
  <!-- Horizontal Beam -->
  <rect x="22" y="32" width="56" height="12" rx="3" fill="url(#goldGrad)" />
</svg>
